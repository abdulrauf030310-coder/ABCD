<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Daraz - Online Shopping</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background-color: #f5f5f5;
}

/* Header & Search */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f57224; /* Daraz Orange */
  padding: 15px 50px;
  color: white;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #1a9cb7;
}

.search-box {
  display: flex;
  width: 50%;
}

.search-box input {
  width: 100%;
  padding: 10px;
  border: none;
  outline: none;
  border-radius: 4px 0 0 4px;
}

.search-box button {
  padding: 10px 20px;
  background-color: #1a9cb7;
  color: white;
  border: none;
  border-radius: 0 4px 4px 0;
}

.cart-btn {
  font-size: 16px;
}

/* Banner */
.banner {
  background-color: #ffe8de;
  text-align: center;
  padding: 40px;
  color: #f57224;
}

/* Product Section */
.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.product-card {
  background: white;
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}

.product-card:hover {
  transform: translateY(-5px);
}

.product-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 4px;
}

.product-card h4 {
  margin: 10px 0;
  font-size: 16px;
}

.price {
  color: #f57224;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

.add-cart-btn {
  background-color: #f57224;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 4px;
}

.add-cart-btn:hover {
  background-color: #d65a13;
}  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">Daraz<span>Clone</span></div>
    <div class="search-box">
      <input type="text" placeholder="Search in Daraz...">
      <button>Search</button>
    </div>
    <div class="cart-btn">
      🛒 Cart (<span id="cart-count">0</span>)
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="banner">
    <h2>Big Sale Live Now!</h2>
    <p>Up to 50% Off on Electronics & Fashion</p>
  </section>

  <!-- Main Content / Products -->
  <main class="container">
    <h3>Flash Sale</h3>
    <div class="product-grid" id="product-list">
      <!-- Products will be injected here using JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
