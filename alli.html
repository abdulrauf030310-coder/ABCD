<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= device-width, initial-scale=1.0">
    <title> Contact Us </title>
    <style>
        .select{
            padding: 5px;
        }
        .submit{
            padding: 3px;
        }
        .clear{
            padding: 3px;
        }
    </style>
</head>

<body>

    <h1> Contact Us </h1>

    <form>
        
        <!-- <label for=""> First Name </label> -->
        <input type="text" name="" id="" required placeholder="Enter Your First Name">

        <br>>
        <!-- <label for=""> Last Name </label> -->
        <input type="text" name="" id="" placeholder="Enter You Last Name Here">

        <br>
        <!-- <label> Email </label> -->
        <input type="email" name="" id="" required placeholder=" Enter Your Email Here">

        <br>
        <label for="Gender"> Male </label>
        <input type="radio" id="male" name="gender">
        <label for="Gender"> Female </label>
        <input type="radio" id="female" name="gender">

        <br>
        <!-- <label for=""> Search </label> -->
        <input type= "search" name="" id="" required placeholder="Search Here">

        <br>
        <!-- <label> Enter Url Here </label> -->
        <input type="url" name="" id="" required placeholder="Enter URL Here">

        <br>
        <!-- <label for=""> CVV </label> -->
        <input type="number" maxlength="4" name="" id="" placeholder="CVV">
        <br>

        <select class="select">
            
            <option value=""> General Enquiry </option>
            <option value=""> Career </option>
            <option value=""> Assignments </option>
            <option value=""> Tests </option>

        </select>

        <br>
        <input type="submit" value="submit" class="submit">
        <input type="reset" value="Clear All" class="clear">

    </form>
    
</body>

</html>
